; Smart Room ESP32 node — PlatformIO alternative to the Arduino IDE.
; `pio run --target upload` then `pio device monitor -b 115200`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; v0.2 reads the DHT11/DHT22 climate sensor, so the DHT libraries are back in.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.14
